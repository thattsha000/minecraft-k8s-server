apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dynmap
  namespace: minecraft
spec:
  ingressClassName: nginx
  rules:
    - host: dynmap-survival.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dynmap-nodeport
                port:
                  number: 8123
    - host: dynmap-creative.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dynmap-nodeport-creative
                port:
                  number: 8123
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: monitoring
  namespace: monitoring
spec:
  ingressClassName: nginx
  rules:
    - host: grafana.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-grafana
                port:
                  number: 80
    - host: prometheus.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: monitoring-kube-prometheus-prometheus
                port:
                  number: 9090
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd
  namespace: argocd
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  rules:
    - host: argocd.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 443