apiVersion: v1
kind: ConfigMap
metadata:
    name: mc-proxy-config 
    namespace: minecraft
data:
    velocity.toml: |
      config-version = "2.8"
      bind = "0.0.0.0:25577"
      online-mode = true
      player-info-forwarding-mode = "modern"
      forwarding-secret-file = "/etc/velocity-secret/forwarding-secret"

      [servers]
        survival = "mc-0.mc-headless.minecraft.svc.cluster.local:25565"
        creative = "mc-creative-0.mc-headless-creative.minecraft.svc.cluster.local:25565"
        try = ["survival"]
      [forced-hosts]

