apiVersion: v1
kind: ConfigMap
metadata:
    name: mc-config-creative  
    namespace: minecraft
data:
    DIFFICULTY: "peaceful"
    MODE: "creative"
    MAX_PLAYERS: "5"
    MOTD: "A creative server running on Kind Cluster"
    ENABLE_RCON: "true"
    ONLINE_MODE: "false"
    FORCE_GAMEMODE: "true"
    
