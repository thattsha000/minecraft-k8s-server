apiVersion: v1
kind: Namespace
metadata:
  name: minecraft
---
apiVersion: v1
kind: Service 
metadata:
  name: mc-headless-creative
  namespace: minecraft
spec:
  selector:
    app: minecraft-creative
  clusterIP: None
  ports:
    - port: 25565 
---
apiVersion: apps/v1
kind: StatefulSet
#names the pod
metadata:
  name: mc-creative
  namespace: minecraft
#defines how many replicas to run, which headless service to use, and which pods belong to this StatefulSet via the selector
spec:
  serviceName: mc-headless-creative
  replicas: 1
  selector:
    matchLabels:
      app: minecraft-creative
  #Template for pods
  template:
    metadata:
      labels:
        app: minecraft-creative
    #details about actual container inside 
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: minecraft
          image: itzg/minecraft-server:java21
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: "PAPER"
            - name: VERSION
              value: "1.21.4"
            - name: MEMORY #memory for JVM heap 
              value: "1G"
            - name: RCON_PASSWORD_FILE 
              value: "/etc/mc-secret/rcon_password"
            #same as the service port
            - name: MODRINTH_PROJECTS
              value: "dynmap:3.7-beta-8"
          envFrom: 
            - configMapRef:
                name: mc-config-creative
          ports:
            - containerPort: 25565
            #all storage persists on this file path 
          volumeMounts:
            - name: world-data
              mountPath: /data
              #These are the resources (min/max) pods are allowed to use 
            - name: rcon-secret
              mountPath: /etc/mc-secret
              readOnly: true
          resources:
            requests:
              cpu: "500m"
              memory: "1.25Gi"
            limits:
              memory: "1.5Gi"
  #Each pod gets its(different in statefulstate)
      #For secret mounts 
      volumes: 
        - name: rcon-secret
          secret: 
            secretName: mc-secret
  volumeClaimTemplates:
    - metadata:
        name: world-data
      spec:
      #storage stuff -> only one pod can mount volume at a time 
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
    