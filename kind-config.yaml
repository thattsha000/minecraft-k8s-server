kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: minecraft-test-server
nodes:
  - role: control-plane
  - role: worker
    extraPortMappings:
    #On a docker container so NodePorts cant be accessed directly from computer's network. You have to set up this to map containers ports to matching ports on our container 
      - containerPort: 30565
        hostPort: 30565
        protocol: TCP
        #dynamo on localhost port 
      - containerPort: 30123
        hostPort: 30123
        protocol: TCP
  - role: worker