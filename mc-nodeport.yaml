apiVersion: v1
kind: Service
metadata:
  name: mc-nodeport
  namespace: minecraft
spec: 
  type: NodePort
  selector: 
    app: mc-proxy
  ports: 
    - name: minecraft
      protocol: TCP
      port: 25565
      targetPort: 25577
      nodePort: 30565
---
apiVersion: v1
kind: Service
metadata:
  name: dynmap-nodeport
  namespace: minecraft
spec: 
  type: NodePort
  selector: 
    app: minecraft
  ports: 
    - name: dynmap
      protocol: TCP
      port: 8123
      targetPort: 8123
      nodePort: 30123