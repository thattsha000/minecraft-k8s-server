apiVersion: v1
kind: Service
metadata:
  name: mc-nodeport
  namespace: minecraft
spec: 
  type: NodePort
  selector: 
    app: minecraft
  ports: 
    - name: minecraft
      protocol: TCP
      port: 25565
      targetPort: 25565
      nodePort: 30565
    - name: dynmap
      protocol: TCP
      port: 8123
      targetPort: 8123
      nodePort: 30123